<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
window.generateExcelReport = function(){
  try{
    console.log("Generating Excel...");
    var wb = XLSX.utils.book_new();
    
    // Get site name and manager from inputs
    var inputs = document.querySelectorAll('input');
    var siteName = inputs[0] ? inputs[0].value : "";
    var managerName = inputs[1] ? inputs[1].value : "";
    
    // Sheet 1: ملخص الزيارة
    var summary = [
      ["المصرية جروب لإدارة المشروعات - تقرير إشراف"],
      [],
      ["رقم التقرير", document.querySelector('[class*="bg-slate-900"][class*="rounded-full"]')?.textContent || "EG-RPT"],
      ["اسم الموقع", siteName],
      ["مدير التشغيل", managerName],
      ["التاريخ", new Date().toLocaleDateString("ar-EG") + " " + new Date().toLocaleTimeString("ar-EG")],
      ["نسبة الإنجاز", document.body.innerText.match(/\d+%/) ? document.body.innerText.match(/\d+%/)[0] : ""],
      [],
      ["تفاصيل البنود (30 بند)"],
      ["م", "البند", "القسم", "الحالة", "الملاحظات", "عدد الصور"]
    ];
    
    // Try to get actual checklist from DOM
    var sections = ["الأرضيات والممرات","الحوائط والواجهات","دورات المياه والتعطير","السلامة والمرافق","الخدمات والترتيب العام"];
    var allItems = document.querySelectorAll('div[class*="rounded-[18px]"][class*="border"]');
    console.log("Found items:", allItems.length);
    
    var rowNum = 1;
    // Fallback static list with actual status detection
    var titles = ["نظافة الأرضيات","تلميع الأرضيات","نظافة السيراميك","نظافة الرخام","نظافة الممرات","نظافة الزوايا","نظافة الحوائط","إزالة خيوط العنكبوت","نظافة النوافذ","نظافة الأبواب والمقابض","نظافة الواجهة","نظافة اللوحات","نظافة دورات المياه","نظافة المراحيض","نظافة الأحواض","نظافة المرايا","نظافة أرضيات وجدران الحمامات","تعطير المكان","نظافة الإطارات","نظافة طفايات الحريق","نظافة سلالم الطوارئ","نظافة الدرابزين","نظافة المصاعد","الإضاءة والتهوية","نظافة مواقف السيارات","نظافة غرف الرابش","فصل النفايات","نظافة حاويات القمامة","ترتيب المكان","حالة الأثاث"];
    
    // Try to read status from buttons
    var itemDivs = document.querySelectorAll('div.rounded-\[18px\]');
    titles.forEach(function(title, idx){
      var status = "";
      var note = "";
      var photos = 0;
      var section = sections[Math.floor(idx/6)] || "";
      
      // Try to find the corresponding DOM element
      try{
        var textareas = document.querySelectorAll('textarea');
        if(textareas[idx]) note = textareas[idx].value;
        
        // Check for status buttons near this item
        var container = itemDivs[idx];
        if(container){
          if(container.innerHTML.includes('bg-emerald-600') && container.innerHTML.includes('ممتاز')) status = "ممتاز";
          else if(container.innerHTML.includes('bg-amber-500') && container.innerHTML.includes('يحتاج')) status = "يحتاج تحسين";
          else if(container.innerHTML.includes('bg-rose-600') && container.innerHTML.includes('سيئ')) status = "سيئ";
          
          var photoMatch = container.innerText.match(/(\d+)\s*صورة/);
          if(photoMatch) photos = photoMatch[1];
        }
      }catch(e){}
      
      summary.push([rowNum++, title, section, status, note, photos]);
    });
    
    var ws1 = XLSX.utils.aoa_to_sheet(summary);
    // Set column widths
    ws1['!cols'] = [{wch:6},{wch:25},{wch:20},{wch:12},{wch:30},{wch:10}];
    XLSX.utils.book_append_sheet(wb, ws1, "تقرير الزيارة");
    
    // Sheet 2: المعدات
    var equipData = [
      ["المعدات والأجهزة - 20 معدة"],
      [],
      ["م", "اسم المعدة", "العدد", "الحالة", "ملاحظات"]
    ];
    var equipNames = ["رايد أون","سنجل ديسك","هاي بريشر","ماتور سحب مياه","مكنسة كهربائية","مكنسة برميل","هوفر شفط مياه واتربة","تروللي نظافة","عربة مزدوجة","ترولي","توينتك","ماكينة تلميع","تلميع سلالم","سلالم","سلم متحرك","غسيل سجاد","غسيل مفروشات","سكرابر","سويبر","شفط مياه"];
    
    var equipInputs = document.querySelectorAll('input[placeholder="0"]');
    equipNames.forEach(function(name, i){
      var qty = equipInputs[i] ? equipInputs[i].value : "";
      equipData.push([i+1, name, qty, qty>0?"موجودة":"غير موجودة", ""]);
    });
    
    var ws2 = XLSX.utils.aoa_to_sheet(equipData);
    ws2['!cols'] = [{wch:6},{wch:20},{wch:10},{wch:15},{wch:25}];
    XLSX.utils.book_append_sheet(wb, ws2, "المعدات");
    
    // Sheet 3: الطقس
    var weatherData = [
      ["حالة الطقس"],
      [],
      ["الموقع", "الحرارة", "الرطوبة", "الرياح"]
    ];
    // Try to extract weather from page
    var weatherCards = document.querySelectorAll('div.rounded-\[18px\].border');
    // For now add static
    ["الرحاب","مدينتي","العاصمة الإدارية","التجمع","القاهرة"].forEach(function(city){
      weatherData.push([city, "", "", ""]);
    });
    var ws3 = XLSX.utils.aoa_to_sheet(weatherData);
    XLSX.utils.book_append_sheet(wb, ws3, "الطقس");
    
    var fileName = "تقرير_" + (siteName || "المصرية_جروب") + "_" + new Date().toISOString().slice(0,10) + ".xlsx";
    XLSX.writeFile(wb, fileName);
    
    // Show success message
    var msg = document.createElement('div');
    msg.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#059669;color:white;padding:12px 20px;border-radius:12px;z-index:9999;font-family:Cairo;font-weight:bold;';
    msg.textContent = 'تم تحميل الإكسل: ' + fileName;
    document.body.appendChild(msg);
    setTimeout(function(){msg.remove()}, 3000);
    
    return true;
  }catch(err){
    console.error("Excel failed:", err);
    alert("فشل إنشاء الإكسل: " + err.message + "\n\nتأكد من الاتصال بالإنترنت");
    return false;
  }
};


// New Report Button - replaces Excel export
window.newReport = function(){
  var modal = document.getElementById('newReportModal');
  if(!modal){
    modal = document.createElement('div');
    modal.id = 'newReportModal';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(8px);z-index:10000;display:none;align-items:center;justify-content:center;padding:20px;';
    modal.innerHTML = `
      <div style="background:white;border-radius:24px;padding:32px 24px;max-width:400px;width:100%;text-align:center;box-shadow:0 24px 48px -12px rgba(0,0,0,0.25);font-family:Cairo,sans-serif;">
        <div style="font-size:48px;margin-bottom:16px;">📝</div>
        <h3 style="font-size:20px;font-weight:800;margin-bottom:8px;color:#0F172A;">تقرير جديد؟</h3>
        <p style="font-size:14px;color:#64748B;margin-bottom:24px;line-height:1.6;">
          هل أنت متأكد من بدء تقرير جديد؟<br>
          سيتم مسح البيانات الحالية لبدء تقرير جديد.
        </p>
        <div style="display:flex;gap:12px;">
          <button id="cancelNewReport" style="flex:1;padding:14px;background:#F1F5F9;color:#475569;border:none;border-radius:12px;font-family:Cairo;font-weight:700;cursor:pointer;">إلغاء</button>
          <button id="confirmNewReport" style="flex:1;padding:14px;background:#14B8A6;color:white;border:none;border-radius:12px;font-family:Cairo;font-weight:700;cursor:pointer;">نعم، تقرير جديد</button>
        </div>
        <div style="margin-top:16px;">
          <button id="exportAndNew" style="width:100%;padding:12px;background:white;color:#14B8A6;border:2px solid #14B8A6;border-radius:12px;font-family:Cairo;font-weight:700;cursor:pointer;font-size:13px;">📊 تصدير إكسل أولاً ثم تقرير جديد</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    document.getElementById('cancelNewReport').onclick = function(){ modal.style.display='none'; };
    document.getElementById('confirmNewReport').onclick = function(){ modal.style.display='none'; window.doNewReport(); };
    document.getElementById('exportAndNew').onclick = function(){ 
      try{ window.generateExcelReport(); }catch(e){}
      setTimeout(function(){ modal.style.display='none'; window.doNewReport(); }, 1000);
    };
    modal.onclick = function(e){ if(e.target === modal) modal.style.display='none'; };
  }
  modal.style.display='flex';
};

window.doNewReport = function(){
  try{
    var loading = document.createElement('div');
    loading.style.cssText = 'position:fixed;inset:0;background:rgba(255,255,255,0.9);z-index:10001;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Cairo;';
    loading.innerHTML = '<div style="font-size:48px;margin-bottom:16px;">🔄</div><div style="font-weight:800;color:#0F172A;">جاري تجهيز تقرير جديد...</div>';
    document.body.appendChild(loading);
    var scriptUrl = localStorage.getItem('SUPERVISION_SCRIPT_URL');
    localStorage.clear();
    if(scriptUrl) localStorage.setItem('SUPERVISION_SCRIPT_URL', scriptUrl);
    sessionStorage.clear();
    setTimeout(function(){ window.location.reload(); }, 800);
  }catch(err){
    window.location.reload();
  }
};

// Add New Report Button (replaces Excel)
document.addEventListener('DOMContentLoaded', function(){
  setTimeout(function(){
    // Remove old Excel buttons
    var oldBtns = document.querySelectorAll('button');
    oldBtns.forEach(function(b){
      if(b.textContent.includes('تصدير إكسل') || b.innerHTML.includes('📊 تصدير')){
        try{ if(b.id !== 'exportAndNew') b.remove(); }catch(e){}
      }
    });
    
    var btn = document.createElement('button');
    btn.id = 'newReportBtn';
    btn.innerHTML = '<span style="font-size:18px;">📝</span> تقرير جديد';
    btn.style.cssText = 'position:fixed;bottom:90px;left:20px;z-index:9998;background:linear-gradient(135deg,#14B8A6 0%,#0F766E 100%);color:white;border:none;padding:14px 22px;border-radius:16px;font-family:Cairo,sans-serif;font-weight:800;font-size:14px;box-shadow:0 12px 24px -8px rgba(20,184,166,0.4);cursor:pointer;display:flex;align-items:center;gap:8px;transition:all 0.3s ease;';
    btn.onmouseenter = function(){ this.style.transform='translateY(-2px)'; this.style.boxShadow='0 16px 32px -8px rgba(20,184,166,0.5)'; };
    btn.onmouseleave = function(){ this.style.transform='translateY(0)'; this.style.boxShadow='0 12px 24px -8px rgba(20,184,166,0.4)'; };
    btn.onclick = window.newReport;
    document.body.appendChild(btn);
    console.log("✅ New Report button added - replaces Excel export");
  }, 1500);
});

document.addEventListener('keydown', function(e){
  if((e.ctrlKey || e.metaKey) && e.key === 'n'){
    e.preventDefault();
    window.newReport();
  }
});

});
</script>
